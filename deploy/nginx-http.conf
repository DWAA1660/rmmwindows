# Bootstrap HTTP virtual host for ACME. After certificate issue use nginx.conf.
server {
    listen 80;
    listen [::]:80;
    server_name rmm.parkcountylibrary.org;
    location /.well-known/acme-challenge/ { root /var/www/library-rmm-acme; }
    location / { return 301 https://$host$request_uri; }
}
