name: library-rmm
services:
  rmm:
    image: ${RMM_IMAGE:-library-rmm:local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/rmm.db
      PUBLIC_ORIGIN: https://rmm.parkcountylibrary.org
      COOKIE_SECURE: "true"
      TRUST_PROXY: "1"
      UPDATE_HELPER_URL: http://172.29.60.1:9441
    volumes:
      - /opt/library-rmm/data:/data
    networks: [rmm]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  rmm:
    name: library-rmm
    external: true
